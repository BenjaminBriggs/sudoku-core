name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The nightly soak.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  # The benchmark target links jemalloc, which the runners don't have.
  BENCHMARK_DISABLE_JEMALLOC: "true"

jobs:
  test:
    name: swift test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  hodoku:
    name: HoDoKu cross-check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: java -version
      - run: scripts/hodoku/fetch.sh "$RUNNER_TEMP/hodoku"
      - run: swift test -c release -Xswiftc -enable-testing --filter HoDoKu
        env:
          SUDOKU_HODOKU_JAR: ${{ runner.temp }}/hodoku/HoDoKu.jar
          SUDOKU_HODOKU_REGLIB: ${{ runner.temp }}/hodoku/reglib-1.3.txt

  soak:
    name: Soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: scripts/hodoku/fetch.sh "$RUNNER_TEMP/hodoku"
      - run: swift test -c release -Xswiftc -enable-testing
        env:
          SUDOKU_VERIFY_ALL: "1"
          SUDOKU_SOAK_GENERATE: "20"
          SUDOKU_SOAK_FAILURES: ${{ runner.temp }}/soak-failures.jsonl
          SUDOKU_HODOKU_JAR: ${{ runner.temp }}/hodoku/HoDoKu.jar
          SUDOKU_HODOKU_REGLIB: ${{ runner.temp }}/hodoku/reglib-1.3.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-failures
          path: ${{ runner.temp }}/soak-failures.jsonl
          if-no-files-found: ignore
